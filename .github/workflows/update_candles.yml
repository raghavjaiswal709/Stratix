name: Update Candle Data

# ─── Schedule ─────────────────────────────────────────────────────────────────
#   Runs every 4 hours at minute :17 UTC, 6× per day (previously hourly/24×,
#   reduced once candle storage moved to Cloudflare R2 — see
#   scripts/lib/candle-storage.mjs — since each run no longer costs a git
#   commit + full Vercel redeploy, but 6×/day is still plenty fresh for a
#   1-minute historical archive).
#   Dukascopy data is fetched incrementally — only new rows are appended.
# ─────────────────────────────────────────────────────────────────────────────

on:
  schedule:
    - cron: "17 */4 * * *"   # every 4 hours at minute :17 UTC (avoiding high-load :00 peak)
  workflow_dispatch:
    inputs:
      session:
        description: "Session label (manual)"
        required: false
        default: "manual"
        type: string

# Prevents two overlapping runs from racing on the same R2 object (read-merge-
# rewrite has no server-side conflict detection, unlike the old git-push path
# which failed loudly on a non-fast-forward race).
concurrency:
  group: update-candles

permissions:
  contents: write

jobs:
  update-candles:
    name: Fetch & append latest candles — ${{ github.event.inputs.session || 'scheduled' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30          # Dukascopy fetch for 14 symbols should be well under this

    steps:
      # ── 1. Checkout (full history not needed — just latest commit) ───────
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      # ── 2. Node.js 20 (ESM modules, matches local dev environment) ───────
      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      # ── 3. Install deps (dukascopy-node + all project deps) ──────────────
      #    npm ci is deterministic and respects package-lock.json exactly.
      - name: Install dependencies
        run: npm ci

      # ── 4. Resolve session label ─────────────────────────────────────────
      - name: Resolve session name
        id: session
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "${{ github.event.inputs.session }}" ]; then
            echo "name=${{ github.event.inputs.session }}" >> "$GITHUB_OUTPUT"
          else
            echo "name=scheduled" >> "$GITHUB_OUTPUT"
          fi

      # ── 5. Run the incremental update ────────────────────────────────────
      #    The script reads each symbol's last timestamp from R2, fetches only
      #    the delta from Dukascopy, and writes new rows back to R2 (see
      #    scripts/lib/candle-storage.mjs). It also runs a bounded gap-backfill
      #    pass (see scripts/lib/candle-gaps.mjs) that fills any holes
      #    Dukascopy left via the Twelve Data API — requires TWELVE_DATA_API_KEY
      #    to be set as a repo secret, and is skipped (logged, not fatal) if
      #    it isn't.
      - name: Update candle data
        env:
          SESSION_NAME: ${{ steps.session.outputs.name }}
          TWELVE_DATA_API_KEY: ${{ secrets.TWELVE_DATA_API_KEY }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
        run: node scripts/update_candles.mjs

      # ── 6. Commit & push only if there is new data ───────────────────────
      #    git diff --staged --quiet exits 0 when nothing changed.
      #    We never create an empty commit.
      - name: Commit and push new candles
        run: |
          git config user.name  "Stratix Bot"
          git config user.email "actions@github.com"

          # Stage only the candles directory — nothing else
          git add public/data/candles/

          if git diff --staged --quiet; then
            echo "✓ No new candle data to commit — Dukascopy may not have published yet."
            echo "  This is expected for metals (XAUUSD/XAGUSD) and some FX pairs"
            echo "  which can lag the real-time feed by 1–24 hours."
          else
            # Build a concise stat line for the commit message
            STAT=$(git diff --staged --stat | tail -1)
            git commit -m "chore(candles): ${{ steps.session.outputs.name }} update — ${STAT}"
            git push
            echo "✓ Pushed updated candle files."
          fi
