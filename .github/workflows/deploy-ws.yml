name: Deploy WS Server → Koyeb

# Auto-deploys the WebSocket server to Koyeb (Singapore, free tier)
# whenever anything inside server/ is pushed to master.
# Koyeb is free forever — no credit card, no trial.

on:
  push:
    branches: [master]
    paths:
      - "server/**"
      - ".github/workflows/deploy-ws.yml"

jobs:
  deploy:
    name: Deploy to Koyeb
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy to Koyeb
        uses: koyeb/action-git-deploy@v1
        with:
          api-token: ${{ secrets.KOYEB_TOKEN }}
          app-name: "stratix-ws"
          service-name: "ws-server"
          git-url: "github.com/raghavjaiswal709/Stratix"
          git-branch: "master"
          dockerfile-path: "server/Dockerfile"
          docker-context: "server"
          service-ports: "8080:http"
          service-regions: "sin"
          service-instance-type: "nano"
          service-env: |
            PORT=8080
            NODE_ENV=production
